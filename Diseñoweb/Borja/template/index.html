<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login AJAX</title>

    <!-- CDN JQUERY -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #e3e7ec;
            font-family: Arial, sans-serif;
        }

        .login-panel {
            width: min(420px, 90vw);
            background: #1f2937;
            border: 2px solid #4b5563;
            border-radius: 18px;
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.2);
            padding: 32px 28px;
            color: #f8fafc;
        }

        .login-panel h1 {
            margin: 0 0 20px;
            font-size: 26px;
            text-align: center;
        }

        .login-panel label {
            display: block;
            margin-bottom: 12px;
            font-weight: 600;
            color: #d1d5db;
        }

        .login-panel input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #374151;
            background: #111827;
            color: #f8fafc;
            font-size: 15px;
            margin-top: 6px;
            box-sizing: border-box;
        }

        .login-panel input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
        }

        .login-panel button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 18px;
        }

        .login-panel button:hover {
            background: #1d4ed8;
        }

        .mensaje {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .success {
            color: #22c55e;
        }

        .error {
            color: #ef4444;
        }
    </style>
</head>
<body>

<section class="login-panel">
    <h1>Iniciar sesión</h1>

    <form id="loginForm">
        {% csrf_token %}

        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Entrar</button>
    </form>

    <div id="respuesta" class="mensaje"></div>
</section>

<script>
$(document).ready(function () {

    $("#loginForm").submit(function (e) {
        e.preventDefault();

        $.ajax({
            url: "{% url 'validar' %}", // URL del backend Django
            type: "POST",
            data: {
                username: $("#username").val(),
                password: $("#password").val(),
                csrfmiddlewaretoken: $("input[name=csrfmiddlewaretoken]").val()
            },

            success: function (response) {

                $("#respuesta")
                    .removeClass("error")
                    .addClass("success")
                    .html("✅ Login exitoso");

                console.log(response);

                if (response.role === 'user') {
                    window.location.href = "{% url 'user_dashboard' %}";
                } else {
                    window.location.href = "{% url 'dashboard' %}";
                }

            },

            error: function (xhr) {

                $("#respuesta")
                    .removeClass("success")
                    .addClass("error")
                    .html("❌ Usuario o contraseña incorrectos");

                console.log(xhr.responseText);
            }
        });

    });

});
</script>

</body>
</html>
