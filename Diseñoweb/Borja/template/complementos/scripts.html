    <script>
        const SELECTOR_SIDEBAR_WRAPPER = '.sidebar-wrapper';
        const Default = {
            scrollbarTheme: 'os-theme-light',
            scrollbarAutoHide: 'leave',
            scrollbarClickScroll: true,
        };
        document.addEventListener('DOMContentLoaded', function () {
            const sidebarWrapper = document.querySelector(SELECTOR_SIDEBAR_WRAPPER);

            // Disable OverlayScrollbars on mobile devices to prevent touch interference
            const isMobile = window.innerWidth <= 992;

            if (
                sidebarWrapper &&
                OverlayScrollbarsGlobal?.OverlayScrollbars !== undefined &&
                !isMobile

                OverlayScrollbarsGlobal.OverlayScrollbars(sidebarWrapper, {
                    scrollbars: {
                        theme: Default.scrollbarTheme,
                        autoHide: Default.scrollbarAutoHide,
                        clickScroll: Default.scrollbarClickScroll,
                    },
                });
            }
        });

    <script>
        (() => {
            'use strict';

            const STORAGE_KEY = 'lte-theme';

            const getStoredTheme = () => localStorage.getItem(STORAGE_KEY);
            const setStoredTheme = (theme) => localStorage.setItem(STORAGE_KEY, theme);

            const prefersDark = () => globalThis.matchMedia('(prefers-color-scheme: dark)').matches;

            const getPreferredTheme = () => {
                const stored = getStoredTheme();
                if (stored) return stored;
                return prefersDark() ? 'dark' : 'light';
            };

            const setTheme = (theme) => {
                const resolved = theme === 'auto' ? (prefersDark() ? 'dark' : 'light') : theme;
                document.documentElement.setAttribute('data-bs-theme', resolved);
            };

            setTheme(getPreferredTheme());

            const showActiveTheme = (theme) => {
                // Highlight the active dropdown option
                document.querySelectorAll('[data-bs-theme-value]').forEach((el) => {
                    el.classList.remove('active');
                    el.setAttribute('aria-pressed', 'false');
                    const check = el.querySelector('.bi-check-lg');
                    if (check) check.classList.add('d-none');
                });
                const active = document.querySelector(`[data-bs-theme-value="${theme}"]`);
                if (active) {
                    active.classList.add('active');
                    active.setAttribute('aria-pressed', 'true');
                    const check = active.querySelector('.bi-check-lg');
                    if (check) check.classList.remove('d-none');
                }
                // Sync the topbar trigger icon
                document.querySelectorAll('[data-lte-theme-icon]').forEach((icon) => {
                    icon.classList.toggle('d-none', icon.dataset.lteThemeIcon !== theme);
                });
            };

            globalThis.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                const stored = getStoredTheme();
                if (!stored || stored === 'auto') setTheme(getPreferredTheme());
            });

            document.addEventListener('DOMContentLoaded', () => {
                showActiveTheme(getPreferredTheme());
                document.querySelectorAll('[data-bs-theme-value]').forEach((toggle) => {
                    toggle.addEventListener('click', () => {
                        const theme = toggle.getAttribute('data-bs-theme-value');
                        setStoredTheme(theme);
                        setTheme(theme);
                        showActiveTheme(theme);
                    });
                });
            });
        })();
    </script>

        document.addEventListener('DOMContentLoaded', function () {
            const sidebarLinks = document.querySelectorAll('.app-sidebar .sidebar-wrapper nav a');
            const panels = document.querySelectorAll('.dashboard-panel');

            function switchPanel(targetId) {
                if (!targetId || !targetId.startsWith('#panel-')) return;
                
                // Ocultar todos los paneles
                panels.forEach(p => {
                    p.style.setProperty('display', 'none', 'important');
                    p.classList.remove('active');
                });
                
                // Mostrar el panel seleccionado
                const targetPanel = document.querySelector(targetId);
                if (targetPanel) {
                    targetPanel.style.setProperty('display', 'block', 'important');
                    targetPanel.classList.add('active');
                }

                // Actualizar estados del sidebar
                sidebarLinks.forEach(link => {
                    link.classList.remove('active');
                    const href = link.getAttribute('href');
                    if (href === targetId) {
                        link.classList.add('active');
                        
                        // Si está en un submenú, abrir el menú padre
                        const parentUl = link.closest('.nav-treeview');
                        if (parentUl) {
                            const parentMenu = parentUl.closest('.nav-item');
                            if (parentMenu) {
                                parentMenu.classList.add('menu-open');
                                const mainLink = parentMenu.querySelector('.nav-link');
                                if (mainLink) mainLink.classList.add('active');
                            }
                        }
                    }
                });
            }

            // Escuchar clics en el sidebar
            sidebarLinks.forEach(link => {
                link.addEventListener('click', function (e) {
                    const href = this.getAttribute('href');
                    if (href && href.startsWith('#panel-')) {
                        e.preventDefault();
                        location.hash = href;
                        switchPanel(href);
                    }
                });
            });

            // Activar panel desde el Hash al cargar
            if (location.hash && location.hash.startsWith('#panel-')) {
                switchPanel(location.hash);
            } else {
                switchPanel('#panel-inicio');
            }
        });

        async function buildFormFields(modelName, existingData = null) {
            const fields = modelFields[modelName];
            const container = document.getElementById('crudFormFields');
            container.innerHTML = '';
            
            for (const f of fields) {
                const div = document.createElement('div');
                div.className = 'mb-3';
                
                const label = document.createElement('label');
                label.className = 'form-label fw-semibold';
                label.textContent = f.label;
                div.appendChild(label);
                
                let input;
                
                if (f.type === 'textarea') {
                    input = document.createElement('textarea');
                    input.className = 'form-control form-control-sm';
                    input.rows = 3;
                } else if (f.type === 'select') {
                    input = document.createElement('select');
                    input.className = 'form-select form-select-sm';
                    
                    const res = await fetch(`/dashboard/api/crud/${f.modelRef}/`);
                    const json = await res.json();
                    if (json.success) {
                        if (!f.required) {
                            const opt = document.createElement('option');
                            opt.value = '';
                            opt.textContent = '-- Seleccionar --';
                            input.appendChild(opt);
                        }
                        json.data.forEach(item => {
                            const opt = document.createElement('option');
                            opt.value = item.id;
                            let text = item.nombre || item.ruc || item.username || item.nombre_permiso || item.id || item.codigo_cupon;
                            if (item.first_name && item.last_name) text = `${item.first_name} ${item.last_name}`;
                            if (item.persona_str) text += ` (${item.persona_str})`;
                            opt.textContent = text;
                            input.appendChild(opt);
                        });
                    }
                } else if (f.type === 'checkbox') {
                    div.className = 'mb-3 form-check';
                    label.className = 'form-check-label fw-semibold';
                    
                    input = document.createElement('input');
                    input.type = 'checkbox';
                    input.className = 'form-check-input';
                    
                    div.innerHTML = '';
                    div.appendChild(input);
                    div.appendChild(label);
                } else {
                    input = document.createElement('input');
                    input.type = f.type;
                    input.className = 'form-control form-control-sm';
                    if (f.step) input.step = f.step;
                    if (f.max) input.maxLength = f.max;
                }
                
                input.id = `field-${f.name}`;
                input.name = f.name;
                if (f.required && f.type !== 'checkbox') input.required = true;
                
                if (existingData) {
                    let val = existingData[f.name];
                    if (f.type === 'checkbox') {
                        input.checked = !!val;
                    } else if (f.type === 'datetime-local' && val) {
                        input.value = val.slice(0, 16);
                    } else {
                        input.value = val;
                    }
                } else {
                    if (f.default !== undefined) {
                        if (f.type === 'checkbox') {
                            input.checked = f.default;
                        } else {
                            input.value = f.default;
                        }
                    }
                }
                
                if (f.type !== 'checkbox') {
                    div.appendChild(input);
                }
                container.appendChild(div);
            }
        }

        window.openEditModal = async function(modelName, id) {
            currentCrudModel = modelName;
            document.getElementById('crudObjId').value = id;
            document.getElementById('crudModalLabel').textContent = `Editar en ${modelName.toUpperCase()}`;
            
            const res = await fetch(`/dashboard/api/crud/${modelName}/?id=${id}`);
            const json = await res.json();
            if (json.success) {
                await buildFormFields(modelName, json.data);
                const modal = new bootstrap.Modal(document.getElementById('crudModal'));
                modal.show();
            } else {
                alert('Error al obtener datos: ' + json.message);
            }
        }

        window.submitCrudForm = async function() {
            const id = document.getElementById('crudObjId').value;
            const fields = modelFields[currentCrudModel];
            const data = { id: id };
            
            const form = document.getElementById('crudForm');
            if (!form.reportValidity()) return;
            
            for (const f of fields) {
                const el = document.getElementById(`field-${f.name}`);
                if (f.type === 'checkbox') {
                    data[f.name] = el.checked;
                } else {
                    data[f.name] = el.value;
                }
            }
            
            try {
                const res = await fetch(`/dashboard/api/crud/${currentCrudModel}/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify(data)
                });
                const json = await res.json();
                
                if (json.success) {
                    location.hash = `#panel-${currentCrudModel}`;
                    location.reload();
                } else {
                    alert('Error al guardar: ' + json.message);
                }
            } catch (e) {
                alert('Error de red al guardar: ' + e);
            }
        }

        window.deleteItem = async function(modelName, id) {
            if (!confirm('¿Estás seguro de que deseas eliminar este registro?')) return;
            
            try {
                const res = await fetch(`/dashboard/api/crud/${modelName}/?id=${id}`, {
                    method: 'DELETE',
                    headers: {

                if (json.success) {

                    location.reload();
                } else {
                    alert('Error al eliminar: ' + json.message);
                }
            } catch (e) {
                alert('Error de red al eliminar: ' + e);
            }
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
